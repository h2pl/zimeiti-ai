services:
  postgres:
    image: postgres:16-alpine
    container_name: zimeiti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zimeiti
      POSTGRES_PASSWORD: zimeiti_dev
      POSTGRES_DB: zimeiti
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zimeiti-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zimeiti -d zimeiti"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zimeiti-pgdata:
