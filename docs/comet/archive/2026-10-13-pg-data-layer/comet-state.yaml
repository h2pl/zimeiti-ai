acceptance:
  - id: A1
    source: brief.md
    text: "A1: Given 服务曾在某 session 对话，When 服务重启后用户以同一 session 继续对话，Then agent 上下文从
      PG checkpoint 恢复（不重复注入落盘历史、不出现上下文成倍膨胀）"
    result: passed
    reason:
      text: Runtime restart-checks 日志 A1.1/A1.2 暗号跨重启命中（进程 kill 后重启）；源码
        agent_runtime.py:244-253 checkpoint 为空才注入落盘历史，thread_id 命名空间存
        AsyncPostgresSaver，不重复不膨胀。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Given HITL 问题处于待答状态时服务重启，When 用户经审批端点回答问题，Then pending 状态自 PG
      恢复且对话正常续流"
    result: passed
    reason:
      text: Runtime restart-checks A2 pending 跨重启存活（写/读均在独立子进程）；源码 answer() 从
        pg.pending_get 读、pg.pending_del 删，经 Command(resume) 从 PG checkpoint
        续流。SSE 同连接续流受进程重启限制为已知项，数据级续流正确。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Given PG 中已有 ideas/schedule 记录，When 调用 `/api/ideas`、`/api/schedule`
      的增删改查，Then 状态码与响应结构与文件版一致"
    result: passed
    reason:
      text: Runtime e2e-parity exit=0 全部一致 55 项含 schedule/ideas 增改删两边 200；源码
        ideas/schedule CRUD 全走 _pg.*，字段/状态码与文件版一致。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Given 某 session 刚完成一轮对话，When 调用 `/api/chat/last/{session_id}`，Then
      返回与迁移前一致的轮次结果结构（status/text/at）——该缓存为运行时的状态，保留文件形态（见 Scope「保留文件」）"
    result: passed
    reason:
      text: e2e 55 项含 /api/chat/last 契约一致；源码 _turn_file/_save_turn/api_chat_last
        仍读写文件返回 status/text/at，git diff 确认零改动（缓存按设计留文件）。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Given
      存在旧文件数据（sessions/*.json、_ideas.json、_schedule.json、pending_questions.json\
      ），When 运行一次性导入脚本，Then 数据进入 PG 且脚本可重复执行（幂等，不产生重复记录）"
    result: passed
    reason:
      text: test_import_idempotent 两次 migrate 第二次全跳过；unit-tests exit 0；handoff 记录真实导入
        3 会话/6 消息复跑全跳过，自然键判重。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Given `DATABASE_URL` 未配置或 PG 不可达，When 启动服务，Then 服务 fail-fast
      退出并打印明确提示（指出缺少的配置与排查方向），不静默启动后丢数据"
    result: passed
    reason:
      text: Runtime restart-checks 坏 DATABASE_URL 退出码=3 且输出含 fail-fast+排查指引；源码
        lifespan _pg.verify 失败打印明确提示并 raise，不静默启动。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Given 本变更新建的全部表，When 检查 schema，Then 每张表都带 user_id 维度（本地版默认值固定），为多租户预留"
    result: passed
    reason:
      text: test_user_id_dimension 断言五表 user_id 列存在/默认 local/NOT NULL；pg.py DDL 五表均
        user_id TEXT NOT NULL DEFAULT 'local'；checkpoint 表为官方表经 thread_id
        命名空间隔离（文档披露）。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Given 本变更完成后，When 使用画像/技能/登录态相关端点，Then 行为不回退（仍走文件，与迁移前一致）"
    result: passed
    reason:
      text: Runtime e2e-parity 55/55 一致含画像/技能/7 平台登录态/analytics；源码画像/技能端点仍读文件未改。
      truncated: false
  - id: A9
    source: specs/data-storage/spec.md
    text: 会话删除清尽全部状态 Given 某 session 有历史消息、checkpoint 与 pending 条目， When 调用 `DELETE
      /api/session/{session_key}`， Then PG 中该 session 的消息、checkpoint 与 pending
      条目全部删除，同 key 再聊不复活旧上下文。
    result: passed
    reason:
      text: A9 修复真实充分：pg.py 新增 pending_delete_by_session（user_id+session_key
        作用域）；delete_session 联动调用且 user_id 贯通；DELETE 端点正确 await；新增隔离测试（不误删他
        session pending）与接线测试（删净消息+pending）；adelete_thread 异常保护合理。unit-tests
        exit 0 含 2 项新测试，无误删新问题。
      truncated: false
