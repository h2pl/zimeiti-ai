[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zimeiti-api"
version = "0.2.1"
description = "社媒内容工作流整合层 — Zimeiti AI 后端"
requires-python = ">=3.11"
# 运行依赖统一安装，确保 Web、媒体处理和浏览器发布开箱可用。
dependencies = [
    "fastapi>=0.115,<1",        # Web 后端
    "uvicorn>=0.30,<1",         # ASGI server（zimeiti-api web）
    "python-dotenv>=1,<2",      # .env 加载
    "sse-starlette>=2.1,<4",    # 对话流式 SSE
    "httpx>=0.27,<1",           # HTTP 客户端（趋势取数 / 热点源等出站请求）
    "pydantic>=2.7,<3",         # 请求模型
    "segno>=1.6,<2",             # B站扫码登录二维码渲染（纯 Python）
    "python-multipart>=0.0.9,<1", # FastAPI 文件上传 / Form
    "Pillow>=10,<13",
    "opencv-python>=4.8,<5",
    "numpy>=1.26,<3",
    "pandas>=2,<4",
    "matplotlib>=3.8,<4",
    "librosa>=0.10,<1",
    "faster-whisper>=1,<2",
    "edge-tts>=6,<8",
    "playwright>=1.45,<2",
    "rembg>=2.0,<3",
    "jieba>=0.42,<1",
    "snownlp>=0.12,<1",
    # biliup 钉 1.2.9：最后一个带 cp39-abi3 win_amd64 wheel 的版本（兼容 3.9+，含 3.12/3.14）；
    # 1.2.11 只发 sdist，本机无 Rust 工具链时 uv sync 直接失败。
    "biliup==1.2.9",
    "markdown>=3.5,<4",
    # 对话运行时（zimeiti_api/runtime/agent_runtime.py）：deepagents 承载对话 + HITL 中断
    "deepagents>=0.7,<0.8",
    "langchain-core>=0.3,<3",
    # ChatOpenAI（agent_runtime._build_model）为直接 import，不靠 deepagents 传递
    "langchain-openai>=0.2,<3",
    "psycopg[binary]>=3.1,<4",
    "langgraph-checkpoint-postgres>=2.0,<4",
]

[tool.setuptools.packages.find]
include = ["zimeiti_api*", "zimeiti_harness*", "zimeiti_autonomous*"]

# ---- 质量门禁配置（对齐 comet-integration 家规 check-api.sh）----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
# 家规窄 select：E(pycodestyle)/F(pyflakes)/I(isort)/UP(pyupgrade)/B(bugbear)。
# BLE/S/PL 等不启用——上游 Easel 风格的宽捕获（try-except-pass）属产品行为，不强制改写。
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008：FastAPI 依赖注入惯用法（File()/Form() 作参数默认值），框架设计如此。
"zimeiti_api/content/uploads.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# model_registry 经 paths.py 注入 sys.path（apps/skills/shared/scripts），mypy 不可见；
# vendored 运行时模块，非本仓类型责任面。
module = ["model_registry"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["zimeiti_api", "zimeiti_harness", "zimeiti_autonomous"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
# B110/B112：上游 Easel 风格的 try-except-pass/continue（清理/降级路径）属产品行为；
# B404/B603：subprocess 是登录/发布/whoami 的产品核心路径，且全部不带 shell=True（B603 本身即推荐用法）。
skips = ["B110", "B112", "B404", "B603"]

[project.scripts]
zimeiti-api = "zimeiti_api.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",             # 测试（apps/api/tests）
    "pytest-cov>=5,<8",          # 覆盖率门禁（make check 第 5 道）
    "ruff>=0.6",                 # format + lint 门禁
    "mypy>=1.10",                # 类型门禁
    "bandit>=1.7",               # 安全扫描门禁
    "types-PyYAML>=6",           # yaml 类型 stubs（mypy 严格 import 检查）
]
wechat = ["mistune>=3,<4", "pygments>=2.17", "beautifulsoup4>=4.12"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "behavior: 真实 LLM 行为探针（仅 make evals 跑；make check 用 -m \"not behavior\" 排除）",
]
